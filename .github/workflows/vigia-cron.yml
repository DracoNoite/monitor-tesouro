name: Vigia do cron externo

# O monitor depende de um servico de cron EXTERNO, que chama a API do GitHub e
# dispara o evento repository_dispatch. Esse servico e o mecanismo principal: o
# agendamento nativo do GitHub e melhor-esforco e entrega uma fracao pequena das
# execucoes.
#
# O problema: se o servico externo morrer, o monitor simplesmente roda muito
# menos, sem erro nenhum. Nenhuma execucao falha — elas apenas deixam de
# acontecer. Ausencia nao dispara alarme, e por isso este vigia existe.

# ===========================================================================
# PAUSADO EM 20/08/2026 -- junto com o monitor.yml.
#
# Este vigia so faz sentido com o monitor rodando: ele conta execucoes que
# deveriam existir. Com o monitor pausado, ele acusaria "cron externo
# falhando" todo dia e abriria issue a toa -- alem de gastar minutos.
#
# PARA REATIVAR: descomente o bloco "schedule" abaixo e faca push.
# ===========================================================================

on:
  # >>> PAUSADO -- descomente as 2 linhas abaixo para reativar <<<
  # schedule:
  #   - cron: "30 22 * * 1-5"   # 19h30 de Brasilia, depois do fechamento
  workflow_dispatch:
    inputs:
      limiar:
        description: "Forcar um limiar fixo (vazio = proporcional ao horario)"
        type: string
        default: ""

permissions:
  actions: read     # para contar as execucoes do monitor
  issues: write     # para avisar se estiverem faltando

env:
  # Sem checkout nao ha repositorio git na pasta, e o gh nao consegue inferir
  # em qual repo agir. GH_REPO resolve isso para todos os comandos do job.
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - name: Contar as execucoes disparadas pelo cron externo
        id: contar
        env:
          LIMIAR_FIXO: ${{ inputs.limiar }}
        run: |
          # O pregao vai das 12h as 21h UTC e o cron dispara a cada 15 min, o
          # que daria 36 execucoes no dia inteiro. Um limiar FIXO daria alarme
          # falso em qualquer execucao manual no meio do dia — por isso o
          # esperado e proporcional ao quanto da sessao ja passou.
          HOJE=$(date -u +%Y-%m-%d)
          ABRE=$(date -u -d "${HOJE}T12:00:00Z" +%s)
          FECHA=$(date -u -d "${HOJE}T21:00:00Z" +%s)
          AGORA=$(date -u +%s)
          FIM=$AGORA; [ "$AGORA" -gt "$FECHA" ] && FIM=$FECHA

          DECORRIDO=$(( FIM - ABRE ))
          if [ "$DECORRIDO" -le 0 ]; then
            echo "Fora da sessao — nada a julgar."
            echo "avaliar=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ESPERADO=$(( DECORRIDO / 900 ))
          if [ -n "$LIMIAR_FIXO" ]; then
            LIMIAR=$LIMIAR_FIXO
          else
            LIMIAR=$(( ESPERADO / 2 ))     # tolera perder metade antes de reclamar
          fi

          DESDE=$(date -u -d "@$ABRE" '+%Y-%m-%dT%H:%M:%SZ')
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=repository_dispatch&created=>$DESDE&per_page=100" \
                --jq '.workflow_runs | length')

          echo "sessao decorrida: $(( DECORRIDO / 60 )) min | esperado ~$ESPERADO | recebido $N | limiar $LIMIAR"
          {
            echo "avaliar=sim"
            echo "n=$N"
            echo "esperado=$ESPERADO"
            echo "limiar=$LIMIAR"
          } >> "$GITHUB_OUTPUT"

      - name: Avisar se o cron externo esta falhando
        if: >-
          steps.contar.outputs.avaliar == 'sim' &&
          fromJSON(steps.contar.outputs.n) < fromJSON(steps.contar.outputs.limiar)
        env:
          DONO: ${{ github.repository_owner }}
          N: ${{ steps.contar.outputs.n }}
          ESPERADO: ${{ steps.contar.outputs.esperado }}
          LIMIAR: ${{ steps.contar.outputs.limiar }}
        run: |
          MARCA="Cron externo do monitor esta falhando"
          ABERTA=$(gh issue list --state open --search "in:title \"$MARCA\"" --json number --jq 'length')
          if [ "$ABERTA" -gt 0 ]; then
            echo "Ja existe issue aberta. Nao vou duplicar."
            exit 0
          fi
          CORPO=$(printf '@%s\n\nChegaram **%s** execucoes vindas do cron externo, contra ~%s esperadas na sessao de hoje (limiar: %s).\n\nO monitor nao falhou — ele apenas rodou menos, o que significa reprecificacoes do Tesouro passando despercebidas. Verifique o servico de cron externo.\n\nO agendamento nativo do GitHub segue como rede de seguranca, mas entrega so uma fracao das execucoes.\n' \
                   "$DONO" "$N" "$ESPERADO" "$LIMIAR")
          URL=$(gh issue create --title "$MARCA ($(date -u -d '-3 hours' '+%d/%m/%Y'))" --body "$CORPO")
          echo "issue: $URL"
          gh issue edit "$URL" --add-assignee "$DONO" || echo "(nao consegui atribuir)"

      - name: Registrar quando esta tudo bem
        if: >-
          steps.contar.outputs.avaliar == 'sim' &&
          fromJSON(steps.contar.outputs.n) >= fromJSON(steps.contar.outputs.limiar)
        run: |
          echo "Cron externo saudavel - recebidas ${{ steps.contar.outputs.n }} de ~${{ steps.contar.outputs.esperado }} esperadas."

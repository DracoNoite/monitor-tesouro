name: Monitor Tesouro Direto

# ATENCAO AO FUSO: o GitHub agenda tudo em UTC, e o Brasil e UTC-3.
# 12:00 UTC = 09:00 em Brasilia  |  21:45 UTC = 18:45 em Brasilia
#
# A janela abaixo e de proposito um pouco maior que o pregao (9h30-18h). O
# proprio monitor.py se recusa a agir fora do horario, entao as sobras apenas
# ligam e desligam em 15 segundos. Preferi errar para o lado de nao perder a
# ultima reprecificacao do dia.

# ===========================================================================
# PAUSADO EM 20/08/2026 -- para nao consumir minutos do GitHub Actions.
#
# Os dois gatilhos automaticos (repository_dispatch e schedule) estao
# comentados logo abaixo. Sem gatilho nao existe execucao: o consumo de
# minutos e ZERO, e nada e postado no Discord. O cron externo pode continuar
# batendo na API do GitHub -- sem o repository_dispatch declarado aqui, a
# chamada nao cria execucao nenhuma.
#
# PARA REATIVAR:
#   1. descomente os blocos "repository_dispatch" e "schedule" abaixo
#   2. no monitor.py, volte ALERTAS_DISCORD para True
#   3. commit + push (a mudanca so vale depois de chegar no GitHub)
# ===========================================================================

on:
  # Gatilho principal: um servico de cron externo chama a API do GitHub e dispara
  # este evento. O agendamento nativo do GitHub (schedule, abaixo) e "melhor
  # esforco" e na pratica descartou ~94% das execucoes -- por isso ele virou
  # apenas rede de seguranca, e nao o mecanismo principal.
  # >>> PAUSADO -- descomente as 2 linhas abaixo para reativar <<<
  # repository_dispatch:
  #   types: [verificar]

  # >>> PAUSADO -- descomente as 2 linhas abaixo para reativar <<<
  # schedule:
  #   - cron: "*/15 12-21 * * 1-5"   # rede de seguranca, se o cron externo falhar

  workflow_dispatch:               # botao manual, para testar na hora
    inputs:
      simular_falha:
        description: "Forcar falha para testar se o alarme avisa"
        type: boolean
        default: false

# Evita que duas execucoes se atropelem gravando o estado ao mesmo tempo.
concurrency:
  group: monitor-tesouro
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necessario para gravar de volta estado.json e historico.csv
      issues: write     # o alarme no fim abre issue quando o monitor quebra

    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v7

      # Execucao agendada respeita o pregao (9h30-18h). Ja o clique manual usa
      # --forcar de proposito: e assim que se testa o encanamento a qualquer
      # hora, inclusive fim de semana. Sem isso, um teste feito as 20h sairia
      # "fora do pregao" sem nunca chegar a falar com o site do Tesouro, e a
      # gente nao descobriria nada.
      - name: Rodar o monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [[ "$EVENTO" == "workflow_dispatch" ]]; then
            echo "Execucao manual: ignorando o horario do pregao."
            python3 monitor.py --forcar
          else
            python3 monitor.py
          fi

      # O GitHub apaga tudo ao fim de cada execucao. Para o programa lembrar do
      # que ja avisou, a memoria precisa voltar para o repositorio.
      - name: Guardar a memoria (estado e historico)
        run: |
          if [[ -z "$(git status --porcelain estado.json historico.csv)" ]]; then
            echo "Nada mudou, nao ha o que guardar."
            exit 0
          fi
          git config user.name  "Monitor Tesouro"
          git config user.email "monitor@bot.local"
          git add estado.json historico.csv
          git commit -m "estado: $(date -u -d '-3 hours' '+%d/%m/%Y %H:%M')"
          # Se outra execucao gravou nesse meio tempo, pega o que ela fez e tenta de novo.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "Nao consegui gravar a memoria apos 3 tentativas."
          exit 1

      # O Discord so recebe aviso de DENTRO do monitor.py. Se o script quebra
      # antes disso, ninguem fica sabendo. Este passo cobre esse buraco.
      #
      # Como o monitor roda a cada 15 minutos, um alarme ingenuo abriria dezenas
      # de issues por dia. Por isso so abre se nao houver uma aberta: a primeira
      # falha avisa, as seguintes ficam so no log ate voce fechar a issue.
      - name: Simulacao de falha (teste do alarme)
        if: ${{ inputs.simular_falha }}
        run: |
          echo "[SIMULACAO] Falha proposital para verificar o alarme."
          exit 1

      - name: Abrir issue se o monitor quebrou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DONO: ${{ github.repository_owner }}
          SIMULADO: ${{ inputs.simular_falha }}
        run: |
          if [ "$SIMULADO" = "true" ]; then
            MARCA="[SIMULACAO] Teste do alarme do monitor"
          else
            MARCA="Monitor Tesouro parou de funcionar"
          fi
          ABERTA=$(gh issue list --state open --search "in:title \"$MARCA\"" \
                     --json number --jq 'length')
          if [ "$ABERTA" -gt 0 ]; then
            echo "Ja existe issue aberta para esta falha. Nao vou duplicar."
            exit 0
          fi
          URL=$(gh issue create \
            --title "$MARCA ($(date -u -d '-3 hours' '+%d/%m/%Y %H:%M'))" \
            --body "$(printf '@%s\n\nO monitor falhou e o Discord NAO foi avisado — a notificacao acontece dentro do monitor.py, entao uma quebra antes dela passa em silencio.\n\nEnquanto esta issue estiver aberta, novas falhas nao abrem issue nova (evita dezenas por dia). Feche depois de resolver.\n\nExecucao: %s/%s/actions/runs/%s\n' \
                      "$DONO" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")")
          echo "issue: $URL"
          gh issue edit "$URL" --add-assignee "$DONO" || echo "(nao consegui atribuir)"
